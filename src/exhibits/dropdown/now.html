<div class="variants">
  <div>
    <h3 class="variant">Opens on click</h3>
    <button class="button trigger-click" type="button" popovertarget="now-dropdown-click">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
      Share
      <svg class="icon caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <nav id="now-dropdown-click" class="menu" popover aria-label="Share">
      <ul role="list">
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Copy link
          </a>
        </li>
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            Open on GitHub
          </a>
        </li>
      </ul>
      <ul role="list">
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            Send by email
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <div>
    <h3 class="variant">Opens on hover</h3>

    <!-- interestfor opens it on hover or focus; the click fallback covers browsers without it -->
    <button
      class="button trigger-hover"
      type="button"
      interestfor="now-dropdown-hover"
      popovertarget="now-dropdown-hover"
      popovertargetaction="show"
    >
      Options
      <svg class="icon caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <nav id="now-dropdown-hover" class="menu menu-hover" popover aria-label="Options">
      <ul role="list">
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            Rename
          </a>
        </li>
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Duplicate
          </a>
        </li>
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
            Archive
          </a>
        </li>
      </ul>
      <ul role="list">
        <li>
          <a href="#dropdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
