<button class="button" type="button" commandfor="now-modal" command="show-modal">Modal!</button>

<dialog id="now-modal" class="modal" closedby="any" aria-labelledby="now-modal-title">
  <header class="modal-header">
    <h2 id="now-modal-title">Modal in CSS?</h2>
    <button class="close" type="button" commandfor="now-modal" command="close" aria-label="Close">×</button>
  </header>
  <p>One modal example here! :D</p>
  <footer class="modal-footer">
    <button class="button" type="button" commandfor="now-modal" command="close">Nice!</button>
  </footer>
</dialog>
