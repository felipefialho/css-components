<!-- Icon buttons take their name from the tooltip, so it is read once, not twice -->
<div class="toolbar" role="group" aria-label="Text formatting">
  <button class="icon-button tip-left" type="button" interestfor="now-tip-left" aria-labelledby="now-tip-left">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h8a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6a4 4 0 0 1 0 8"/></svg>
  </button>
  <span id="now-tip-left" class="tooltip tooltip-left" popover="hint">Bold</span>

  <button class="icon-button tip-top" type="button" interestfor="now-tip-top" aria-labelledby="now-tip-top">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4 9 20"/></svg>
  </button>
  <span id="now-tip-top" class="tooltip tooltip-top" popover="hint">Italic</span>

  <button class="icon-button tip-bottom" type="button" interestfor="now-tip-bottom" aria-labelledby="now-tip-bottom">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
  </button>
  <span id="now-tip-bottom" class="tooltip tooltip-bottom" popover="hint">Insert link</span>

  <button class="icon-button tip-right" type="button" interestfor="now-tip-right" aria-labelledby="now-tip-right">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
  </button>
  <span id="now-tip-right" class="tooltip tooltip-right" popover="hint">Code</span>
</div>
