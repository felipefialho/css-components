<div class="tooltips">
  <button class="button tip-top" type="button" interestfor="now-tip-top" aria-describedby="now-tip-top">Top</button>
  <span id="now-tip-top" class="tooltip tooltip-top" popover="hint">Tooltip on top</span>

  <button class="button tip-right" type="button" interestfor="now-tip-right" aria-describedby="now-tip-right">Right</button>
  <span id="now-tip-right" class="tooltip tooltip-right" popover="hint">Tooltip on the right</span>

  <button class="button tip-bottom" type="button" interestfor="now-tip-bottom" aria-describedby="now-tip-bottom">Bottom</button>
  <span id="now-tip-bottom" class="tooltip tooltip-bottom" popover="hint">Tooltip on the bottom</span>

  <button class="button tip-left" type="button" interestfor="now-tip-left" aria-describedby="now-tip-left">Left</button>
  <span id="now-tip-left" class="tooltip tooltip-left" popover="hint">Tooltip on the left</span>
</div>
